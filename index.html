<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webflix</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #e50914;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(#000, transparent);
    }
    .logo {
      color: var(--accent);
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 32px 40px;
    }
    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(229, 9, 20, 0.15);
    }
    .player > div, .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .unmute {
      position: absolute;
      bottom: 70px;
      right: 20px;
      z-index: 2;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .unmute[hidden] { display: none; }
    h1 { margin-top: 24px; font-size: 1.6rem; }
    p.meta { margin-top: 8px; color: var(--muted); }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .logo { font-size: 1.5rem; }
      .unmute { bottom: 60px; right: 10px; padding: 8px 12px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">Webflix</a>
  </header>

  <main>
    <div class="player">
      <div id="yt-player"></div>
      <button class="unmute" id="unmute" hidden>🔊 Activer le son</button>
    </div>
    <h1>En lecture</h1>
    <p class="meta">Lecture automatique depuis YouTube.</p>
  </main>

  <footer>© Webflix</footer>

  <script>
    const VIDEO_ID = "hELAQdvfpqw";
    const unmuteBtn = document.getElementById("unmute");
    let player;

    // Appelée automatiquement par l'API IFrame de YouTube une fois chargée
    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt-player", {
        videoId: VIDEO_ID,
        playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: (e) => {
            e.target.playVideo();
            // Les navigateurs bloquent l'autoplay avec son : on démarre en muet
            if (e.target.isMuted()) unmuteBtn.hidden = false;
          },
        },
      });
    }

    unmuteBtn.addEventListener("click", () => {
      if (!player) return;
      player.unMute();
      player.setVolume(100);
      player.playVideo();
      unmuteBtn.hidden = true;
    });
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
